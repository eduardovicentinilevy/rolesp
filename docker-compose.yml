# Ambiente local: só o PostgreSQL. A API e o front rodam com npm (veja o README).
# As credenciais vêm do .env da raiz; os valores depois de ":-" são os padrões de desenvolvimento.
services:
  db:
    # Debian, e não alpine: a imagem alpine não traz os dados completos do ICU,
    # e a collation pt-BR (ordenação com acento) depende deles.
    image: postgres:16
    container_name: rolesp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rolesp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rolesp_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rolesp}
      # fuso do servidor: o initdb usa o TZ para definir o timezone padrão do banco
      TZ: America/Sao_Paulo
    ports:
      # 127.0.0.1: o banco fica acessível só nesta máquina, não na rede local
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa o $ para o Compose: a variável é lida dentro do container
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  # volume nomeado: os dados sobrevivem a "docker compose down" (só somem com "down -v")
  dados_postgres:
